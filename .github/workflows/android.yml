name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Same code as the website, built into dist/ (the Pages build in docs/ is untouched).
      - run: npm run build:app

      # The android/ project is generated here, not committed.
      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      # Icon + splash from public/favicon.png (black background). Version code is above any old Flet build so this installs as an update.
      - name: Icon, splash and version
        run: |
          mkdir resources
          F=public/favicon.png
          convert $F -filter Lanczos -resize 1024x1024 resources/icon-only.png
          convert -size 1024x1024 xc:black resources/icon-background.png
          convert -size 1024x1024 xc:black \( resources/icon-only.png -resize 676x676 \) -gravity center -composite resources/icon-foreground.png
          convert -size 2732x2732 xc:black \( resources/icon-only.png -resize 512x512 \) -gravity center -composite resources/splash.png
          cp resources/splash.png resources/splash-dark.png
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' \
            --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode $((1000 + GITHUB_RUN_NUMBER))/; s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
          grep -n "applicationId\|versionCode\|versionName" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Signed when the keystore secrets exist (same ones the Flet workflow used), debug-signed otherwise.
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$IN" out/aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
            KEY="$KS_ALIAS"; PASS="$KS_PASS"
          else
            keytool -genkeypair -keystore ks.jks -storepass android -keypass android -alias debug \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Castletool"
            KEY=debug; PASS=android
          fi
          "$BT/apksigner" sign --ks ks.jks --ks-key-alias "$KEY" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out out/castletool.apk out/aligned.apk
          rm -f ks.jks

      - uses: actions/upload-artifact@v4
        with:
          name: castletool-apk
          path: out/castletool.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/castletool.apk
